<div class="entete">
  <h2 class="title">Les acteurs</h2>
  <a routerLink="/acteurs/nouveau" class="bouton">Ajouter un acteur</a>
</div>

@if (acteurs$ | async; as acteurs) {
  <div class="grid">
    @for (a of acteurs; track a.id) {
      <a class="card" [routerLink]="['/acteurs', a.id]">
        <h3>{{ a.prenom }} {{ a.nom }}</h3>
      </a>
    } @empty {
      <p class="vide">Aucun acteur enregistré.</p>
    }
  </div>
} @else if (erreur()) {
  <p class="erreur">{{ erreur() }}</p>
} @else {
  <p class="vide">Chargement...</p>
}
