<article class="card" [ngClass]="{ ancien: estAncien(), recent: !estAncien() }">
  <div class="corps">
    <div class="etiquettes">
      <span class="badge" [ngClass]="{ 'science-fiction': estScienceFiction() }">{{ genre() }}</span>
      @if (estAncien()) {
        <span class="badge-ancien">Avant 2000</span>
      }
    </div>
    <h3>
      <a [routerLink]="['/films', film().id]">{{ film().titre }}</a>
    </h3>
    <p class="info" [ngStyle]="{ color: estDeNolan() ? '#dc2626' : null }">Réalisateur : {{ film().realisateur }}</p>
  </div>
  <div class="talon">
    <div>
      <p class="info">Sortie : {{ film().dateSortie | date:"dd/MM/yyyy" }}</p>
      <p class="info">{{ film().acteurs.length }} acteur(s)</p>
    </div>
    <button type="button" class="supprimer" (click)="onSupprimer()">Supprimer</button>
  </div>
</article>
