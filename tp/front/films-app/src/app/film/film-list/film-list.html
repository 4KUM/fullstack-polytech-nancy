<div class="entete">
  <h2 class="title">Les films</h2>
  <a routerLink="/films/nouveau" class="bouton">Ajouter un film</a>
</div>

@if (erreur()) {
  <p class="erreur">{{ erreur() }}</p>
}

@if (films(); as films) {
  <div class="grid">
    @for (f of films; track f.id) {
      <app-film-card [film]="f" (supprimer)="onSupprimer($event)" />
    } @empty {
      <p class="vide">Aucun film enregistré.</p>
    }
  </div>
} @else {
  <p class="vide">Chargement...</p>
}
